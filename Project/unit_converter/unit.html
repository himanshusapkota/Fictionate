<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="unit.css">

</head>
<body>
   <nav class="nav">

   <section class="title">
    <h1>Unit Converter</h1>
    <p>See the Conversion Type , Select Your Conversion Unit  & Enter the Value and Click Convert !</p>

   </section>

   <section class="converter">
    <form id="form">
        <label for="type">Conversion</label>
        <select id="type">

            
            <optgroup label="Length">

                <option value="km-mi">Kilometers to Miles</option>
                <option value="mi-km">Miles to Kilometers</option>
                <option value="m-ft">Meters to Feet</option>
                <option value="ft-m">Feet to <Meter></Meter></option>
                <option value="m-yd">Meter to Yards</option>
                <option value="yd-m">Yards to Meter</option>
                <option value="cm-in">Centimeters to Inch</option>
                <option value="in-cm">Inch to Centimeters</option>
                
            </optgroup>
            
           


            <optgroup label="Weight">
                <option value="kg-lb">Kilograms to Pounds</option>
                <option value="lb-kg">Pounds to Kilograms</option>
                <option value="g-oz">Grams to Ounces</option>
                <option value="oz-g">Ounces to Grams</option>

            </optgroup>

            


            <optgroup label="Temprature">

                <option value="c-f">Celsius to Fahrenheit</option>
                <option value="f-c">Fahrenheit to Celsius</option>
                <option value="c-k">Celsius to Kelvin</option>
                <option value="k-c">Kelvin to Celsius</option>

            </optgroup>

           


            <optgroup label="Volume">
                <option value="l-gal">Liters to Gallons</option>
                <option value="gal-l">Gallons to Liters</option>
                <option value="ml-floz">Milliliters to Fluid Ounces</option>
                <option value="floz-ml">Fluid Ounces to Milliliters</option>

                
              


            <optgroup label="Speed">

                <option value="kmph-mph">km/h to mph</option>
                <option value="mph-kmph">mph to km/h</option>
                <option value="ms-kmph">m/s to km/h</option>

            </optgroup>

            


            <optgroup label="Time">

             <option value="h-min">Hours to Minutes</option>
             <option value="min-s">Minutes to Seconds</option>
            <option value="d-h">Days to Hours</option>

        </optgroup>

        


        <optgroup label="Area">

          <option value="sqm-sqft">Square Meters to Square Feet</option>
          <option value="ac-ha">Acres to Hectares</option>

        </optgroup>
                     
    </select>

        <label for="number"> Number </label>
        <<input type="number" id="number" step="any" placeholder="Enter a number">

        <button type="submit">Convert</button>


    </form>

    <p id="result"></p>


   </section>

</body>



</html>
